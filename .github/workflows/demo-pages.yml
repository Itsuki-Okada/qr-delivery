# main ブランチへのプッシュで、Supabase なしのデモを GitHub Pages に公開する
#   公開 URL: https://<ユーザー名>.github.io/<リポジトリ名>/admin/
# 事前設定: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: デモをビルド（Supabase 接続なし）
        run: npm run build:demo
        env:
          # https://<user>.github.io/<repo>/ 配下で動かすためのパス
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}admin/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
